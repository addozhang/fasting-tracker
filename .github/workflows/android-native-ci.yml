name: Android CI

on:
  push:
    branches: [main, feature/android-native-rewrite]
  pull_request:

jobs:
  keystore-check:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-keystore: ${{ steps.check.outputs.has-keystore }}
    steps:
      - name: Check if release signing secrets are configured
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.FASTING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has-keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-keystore=false" >> "$GITHUB_OUTPUT"
          fi

  unit-test:
    name: Unit Tests (Play & FOSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests for play and foss flavors
        run: ./gradlew :app:testPlayDebugUnitTest :app:testFossDebugUnitTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

  build-debug:
    name: Debug APKs (Play & FOSS)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleFossDebug

      - name: Upload play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-play-debug-apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk

  build-release:
    name: Release Artifacts (Play AAB & FOSS APK)
    runs-on: ubuntu-latest
    needs: [unit-test, keystore-check]
    env:
      KEYSTORE_BASE64: ${{ secrets.FASTING_KEYSTORE_BASE64 }}
    if: needs.keystore-check.outputs.has-keystore == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/fasting_tracker.keystore

      - name: Build signed Play AAB and FOSS APK
        env:
          FASTING_KEYSTORE_PATH: ${{ runner.temp }}/fasting_tracker.keystore
          FASTING_KEYSTORE_PASSWORD: ${{ secrets.FASTING_KEYSTORE_PASSWORD }}
          FASTING_KEY_ALIAS: ${{ secrets.FASTING_KEY_ALIAS }}
          FASTING_KEY_PASSWORD: ${{ secrets.FASTING_KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease :app:assembleFossRelease

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-play-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Upload FOSS release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-release.apk
